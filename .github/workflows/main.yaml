name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

# Erforderliche Berechtigung, um Pakete (Images) zu schreiben
permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Login bei GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Image bauen und pushen
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Der Name des Images (alles klein schreiben!)
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-webserver:latest
            ghcr.io/${{ github.repository_owner }}/devops-webserver:${{ github.sha }}
      # 3. GitHub Release erstellen (nur wenn ein Tag gepusht wurde)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Automated Release for version ${{ github.ref_name }}
            - Docker Image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          draft: false
          prerelease: false