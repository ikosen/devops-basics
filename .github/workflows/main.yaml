name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

# Erforderliche Berechtigung, um Pakete (Images) zu schreiben
permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Image nur lokal im Runner bauen (noch nicht pushen!)
      - name: Build Docker Image for Testing
        run: docker build -t local-test-image .

      # 2. Den "Smoke Test" ausführen
      - name: Run Smoke Test
        run: |
          # Container im Hintergrund starten
          docker run -d --name test-app -p 8080:80 local-test-image
          
          # Kurz warten, bis Nginx hochgefahren ist
          sleep 5
          
          # Prüfen, ob die Seite erreichbar ist (curl --fail liefert Fehler-Code bei 404/500)
          curl --fail http://localhost:8080 | grep "DevOps"
          
          # Aufräumen
          docker stop test-app && docker rm test-app

      # 3. ERST JETZT: Login & Push (wird nur erreicht, wenn curl oben erfolgreich war)
      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-webserver:latest
            ghcr.io/${{ github.repository_owner }}/devops-webserver:${{ github.ref_name }}