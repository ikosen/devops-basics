name: Docker Build and Push

on:
  push:
    branches: [ "main" ]

# Erforderliche Berechtigung, um Pakete (Images) zu schreiben
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Login bei GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Image bauen und pushen
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Der Name des Images (alles klein schreiben!)
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-webserver:latest
            ghcr.io/${{ github.repository_owner }}/devops-webserver:${{ github.sha }}